<script>
const games={
 lotto649:{name:'大樂透',max:49,size:6},
 super638:{name:'威力彩',max:38,size:6},
 daily539:{name:'今彩539',max:39,size:5}
};

const db={};
const el=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');

function normalize(row,game){
 const cfg=games[game];
 const raw=row.drawNumberSize||row.drawNumberAppear;
 if(!Array.isArray(raw))return null;
 const all=raw.map(Number);
 const nums=all.slice(0,cfg.size);
 if(nums.length!==cfg.size||
 new Set(nums).size!==cfg.size||
 nums.some(n=>!Number.isInteger(n)||n<1||n>cfg.max))return null;
 const date=String(row.lotteryDate||'').slice(0,10);
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return null;
 let special=null;
 if(game!=='daily539'){
 const s=all[cfg.size];
 const max=game==='super638'?8:49;
 if(Number.isInteger(s)&&s>=1&&s<=max&&
 (game==='super638'||!nums.includes(s)))special=s;
 }
 return {date,period:String(row.period||''),nums:nums.sort((a,b)=>a-b),special};
}

async function loadData(){
 el('status').textContent='正在讀取資料...';
 el('status').className='';
 const errors=[];
 await Promise.all(Object.keys(games).map(async game=>{
 try{
 const res=await fetch('data/'+game+'.json?t='+Date.now(),{cache:'no-store'});
 if(!res.ok)throw Error('HTTP '+res.status);
 const json=await res.json();
 const unique=new Map();
 json.records.forEach(row=>{
 const r=normalize(row,game);
 if(r)unique.set(r.period||r.date,r);
 });
 const rows=[...unique.values()].sort((a,b)=>a.date.localeCompare(b.date)||a.period.localeCompare(b.period));
 if(!rows.length)throw Error('無有效資料');
 db[game]={rows,updated:json.updated_at,
 rejected:json.records.length-rows.length,
 failed:json.failed_months||[]};
 }catch(e){
 delete db[game];
 errors.push(games[game].name+': '+e.message);
 }
 }));
 el('database').textContent=Object.keys(games).map(g=>games[g].name+' '+(db[g]?db[g].rows.length+'期':'未載入')).join('｜');
 el('status').className=errors.length?'err':'ok';
 el('status').textContent=errors.length?errors.join('；'):'三彩資料載入成功';
 render();
}

function inc(map,key){
 map[key]=(map[key]||0)+1;
}

function comboTable(map,total){
 return Object.entries(map)
 .sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))
 .slice(0,20)
 .map(([k,v])=>'<tr><td>'+k+'</td><td>'+v+'</td><td>'+(100*v/total).toFixed(1)+'%</td></tr>').join('');
}

function bars(map,total){
 return Object.entries(map).map(([k,v])=>
 '<small>'+k+'：'+v+'次 ('+(100*v/total).toFixed(1)+'%)</small>'+
 '<div class="bar"><div class="fill" style="width:'+(100*v/total)+'%"></div></div>'
 ).join('');
}

function render(){
 const game=el('game').value;
 const cfg=games[game];
 const data=db[game];

 ['matrix','stats','pairs','triples','oddEven','tails','sameTail','zones','zoneCount','sums','consecutive','history','latestNumbers','special','summary','updated','latestDate'].forEach(id=>el(id).textContent='');

 if(!data){
 el('latestDate').textContent='尚無資料';
 return;
 }

 const rows=data.rows;
 const latest=rows[rows.length-1];
 const sample=rows.slice(-Number(el('period').value));
 const N=sample.length;

 el('updated').textContent=
 '更新時間：'+new Date(data.updated).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})+
 '｜略過：'+data.rejected+
 '｜失敗月份：'+(data.failed.join(', ')||'無');

 el('latestDate').textContent=latest.date+'｜第'+latest.period+'期';

 el('latestNumbers').innerHTML=latest.nums.map(n=>'<span class="num">'+pad(n)+'</span>').join('');

 if(latest.special!==null){
 el('latestNumbers').innerHTML+='<span class="num special">'+pad(latest.special)+'</span>';
 el('special').textContent=game==='super638'?'紅色為第二區':'紅色為特別號';
 }

 el('summary').textContent='實際分析：'+N+'期';

 const stats=Array.from({length:cfg.max},(_,i)=>{
 const n=i+1;
 const hits=[];
 sample.forEach((r,j)=>{if(r.nums.includes(n))hits.push(j)});
 const gaps=hits.slice(1).map((v,j)=>v-hits[j]);
 let gap=0;
 for(let j=rows.length-1;j>=0;j--){
 if(rows[j].nums.includes(n))break;
 gap++;
 }
 return {
 n,count:hits.length,gap,
 avg:gaps.length?(gaps.reduce((a,b)=>a+b,0)/gaps.length).toFixed(1):'—',
 longest:gaps.length?Math.max(...gaps):'—'
 };
 });

 const max=Math.max(...stats.map(s=>s.count));

 el('matrix').innerHTML=stats.map(s=>'<div class="ball '+(s.count===max&&max>0?'hot':'')+'">'+pad(s.n)+'<small>'+s.count+'次</small></div>').join('');

 el('stats').innerHTML=[...stats].sort((a,b)=>b.count-a.count||a.n-b.n).map(s=>'<tr><td>'+pad(s.n)+'</td><td>'+s.count+'</td><td>'+(s.gap===rows.length?'至少':'')+s.gap+'</td><td>'+s.avg+'</td><td>'+s.longest+'</td></tr>').join('');

 const pairs={},triples={},odd={},tails={},zones={},zoneCount={},sums={};
 let sameTail=0,consecutive=0;
 let sumTotal=0,min=Infinity,maxSum=0;

 for(let i=0;i<=cfg.size;i++)odd[i+'奇'+(cfg.size-i)+'偶']=0;
 for(let i=0;i<10;i++)tails['尾數 '+i]=0;
 for(let i=0;i<=Math.floor(cfg.max/10);i++)zones[i+'x區']=0;

 sample.forEach(r=>{
 const a=r.nums;
 const o=a.filter(n=>n%2===1).length;
 inc(odd,o+'奇'+(cfg.size-o)+'偶');

 const tailSet=new Set(a.map(n=>n%10));
 if(tailSet.size<a.length)sameTail++;

 if(a.some((n,i)=>i>0&&n-a[i-1]===1))consecutive++;

 inc(zoneCount,new Set(a.map(n=>Math.floor(n/10))).size+'種開頭');

 a.forEach(n=>{
 inc(tails,'尾數 '+n%10);
 inc(zones,Math.floor(n/10)+'x區');
 });

 const sum=a.reduce((x,y)=>x+y,0);
 sumTotal+=sum;
 min=Math.min(min,sum);
 maxSum=Math.max(maxSum,sum);
 const low=Math.floor(sum/25)*25;
 inc(sums,low+'–'+(low+24));

 for(let i=0;i<a.length;i++){
 for(let j=i+1;j<a.length;j++){
 inc(pairs,pad(a[i])+' '+pad(a[j]));
 for(let k=j+1;k<a.length;k++){
 inc(triples,pad(a[i])+' '+pad(a[j])+' '+pad(a[k]));
 }
 }
 }
 });

 el('pairs').innerHTML=comboTable(pairs,N);
 el('triples').innerHTML=comboTable(triples,N);
 el('oddEven').innerHTML=bars(odd,N);
 el('tails').innerHTML=bars(tails,N*cfg.size);
 el('sameTail').textContent='含同尾數：'+sameTail+'期，比例 '+(100*sameTail/N).toFixed(1)+'%';
 el('zones').innerHTML=bars(zones,N*cfg.size);
 el('zoneCount').innerHTML=bars(zoneCount,N);
 el('sums').innerHTML='<p>平均和值：'+(sumTotal/N).toFixed(1)+'｜最低：'+min+'｜最高：'+maxSum+'</p>'+bars(Object.fromEntries(Object.entries(sums).sort((a,b)=>parseInt(a[0])-parseInt(b[0]))),N);
 el('consecutive').textContent='含連號：'+consecutive+'期，比例 '+(100*consecutive/N).toFixed(1)+'%';

 el('history').innerHTML=rows.slice(-20).reverse().map(r=>'<tr><td>'+r.date+'</td><td>'+r.nums.map(pad).join(' ')+'</td><td>'+(r.special===null?'—':pad(r.special))+'</td></tr>').join('');
}

loadData();
</script>
 <script src="cross_analysis.js"></script>
 <script src="backtest.js"></script>
 <script src="validation.js"></script>
 <script src="optimization.js"></script>
 <script src="stability.js"></script>
 <script src="research.js"></script>
<script>
(function(){
'use strict';
const key='lotto_forward_v8', U=Array.from({length:49},(_,i)=>i+1), $=id=>document.getElementById('v8'+id);
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const panel=document.createElement('div');panel.className='card';panel.id='v8panel';
panel.innerHTML=`<h2>自訂條件整合研究 V8.0</h2><p>零元前瞻模擬；條件僅改變組合配置，不代表預測優勢。</p>
<style>#v8panel input:not([type=checkbox]){width:100%;background:#111827;color:white;border:1px solid #64748b;border-radius:10px;padding:12px;font-size:16px}#v8panel label{display:block;padding:7px 0;color:#b3c0d5}#v8panel button{margin-bottom:6px}#v8panel .v8pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style>
<label>目標開獎日期（台灣）<input id="v8Date" type="date"></label><label>模擬組數<select id="v8Count"><option>4</option><option>5</option><option>6</option><option>7</option><option selected>8</option><option>10</option></select></label>
<label>配置模型<select id="v8Mode"><option value="A">A 隨機</option><option value="H">H 廣泛覆蓋（各組不重複號碼）</option><option value="I" selected>I 兩碼／三碼覆蓋</option><option value="J">J 核心集中</option><option value="K">K 混合配置</option></select></label>
<label>歷史範圍<select id="v8Window"><option>60</option><option>100</option><option>200</option><option value="99999">全部</option></select></label>
<details open><summary>歷史參考條件（可勾選）</summary><div id="v8Flags"></div></details>
<details open><summary>自訂組合限制</summary><label>每組必選號碼（空格或逗號）<input id="v8Must" placeholder="例如 12 25"></label><label>全部排除號碼<input id="v8Exclude" placeholder="例如 41"></label><label>核心號碼（J/K；空白時隨機選2碼）<input id="v8Core" placeholder="例如 15 26"></label><label>允許奇數個數（空白不限）<input id="v8Odd" placeholder="例如 1 2 4 5"></label><label>每組指定開頭區間（必須完全符合，0～4）<input id="v8Zones" placeholder="例如 0 1 3 4"></label><label>每組不同開頭數（空白不限）<input id="v8ZoneCount" type="number" min="1" max="5"></label><label>至少同尾數<input id="v8Tail" type="checkbox"></label><label>至少一個連號<input id="v8Consecutive" type="checkbox"></label><label>和值範圍（空白不限）</label><div class="v8pair"><input id="v8Min" type="number" placeholder="最低"><input id="v8Max" type="number" placeholder="最高"></div></details>
<button id="v8Run">產生零元模擬組合</button><p id="v8Status" role="status"></p><div id="v8Result"></div><button id="v8Save" disabled>保存開獎前研究組合</button><p>研究截止設定：目標日台灣時間20:00；紀錄為本機時間戳，非不可竄改證明。</p><h3>前瞻研究紀錄</h3><button id="v8Check">重新載入資料並比對</button><div id="v8History"></div><button id="v8Export">匯出前瞻及 V7 研究紀錄</button><button id="v8ImportBtn">匯入 V7 / V8 備份（合併）</button><input id="v8Import" type="file" accept=".json,application/json" hidden><p>實際投注 NT$0（研究模式）。</p>`;
document.body.insertBefore(panel,document.querySelector('.card').nextSibling);
const flagNames=['冷熱號','遺漏週期','兩碼歷史關聯','三碼歷史關聯','最近三期留號（偏好1–2碼）','威力彩連動（偏好1碼）','今彩539連動（偏好1碼）'];
$('Flags').innerHTML=flagNames.map((n,i)=>`<label><input type="checkbox" id="v8F${i}"> ${n}</label>`).join('');$('Date').value=today();
const tell=s=>$('Status').textContent=s, sorted=a=>[...a].sort((a,b)=>a-b), fmt=a=>a.map(n=>String(n).padStart(2,'0')).join(' ');
function parse(s,min,max){if(!s.trim())return [];const v=s.trim().split(/[\s,，、]+/).map(Number);if(v.some(n=>!Number.isInteger(n)||n<min||n>max))throw Error('號碼或條件超出範圍');return [...new Set(v)];}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function combos(a){const p=[],t=[];for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){p.push(a[i]*50+a[j]);for(let k=j+1;k<a.length;k++)t.push(a[i]*2500+a[j]*50+a[k]);}return [p,t];}
function opts(){let s={date:$('Date').value,count:+$('Count').value,mode:$('Mode').value,window:+$('Window').value,must:parse($('Must').value,1,49),exclude:parse($('Exclude').value,1,49),core:parse($('Core').value,1,49),odd:parse($('Odd').value,0,6),zones:parse($('Zones').value,0,4),zc:$('ZoneCount').value?+$('ZoneCount').value:null,min:$('Min').value?+$('Min').value:21,max:$('Max').value?+$('Max').value:279,tail:$('Tail').checked,consecutive:$('Consecutive').checked,flags:flagNames.map((_,i)=>$('F'+i).checked)};if(!/^\d{4}-\d{2}-\d{2}$/.test(s.date)||s.date<today())throw Error('請選今日或未來日期');if(s.min>s.max||s.must.length>6||s.core.length>6||s.zc!==null&&(!Number.isInteger(s.zc)||s.zc<1||s.zc>5)||s.zones.length&&s.zc!==null&&s.zones.length!==s.zc)throw Error('條件互相衝突');if(s.must.some(n=>s.exclude.includes(n))||s.core.some(n=>s.exclude.includes(n)))throw Error('必選／核心與排除號碼衝突');if(s.mode==='H'&&(s.must.length||s.count*6>49-s.exclude.length))throw Error('H 模型要求各組號碼不重複；請減少組數、移除每組必選或減少排除');return s;}
function generate(s, data){const base=U.filter(n=>!s.exclude.includes(n));if(base.length<6)throw Error('候選號碼不足');const hist=data.lotto649.rows.filter(r=>r.date<s.date).slice(-s.window);if(!hist.length)throw Error('沒有目標日前資料');const freq=Array(50).fill(0),gap=Array(50).fill(hist.length),p=new Map(),t=new Map();hist.forEach((r,i)=>{r.nums.forEach(n=>{freq[n]++;gap[n]=hist.length-1-i;});let [a,b]=combos(r.nums);a.forEach(n=>p.set(n,(p.get(n)||0)+1));b.forEach(n=>t.set(n,(t.get(n)||0)+1));});const recent=new Set(hist.slice(-3).flatMap(r=>r.nums));function cross(g){return new Set((data[g]?.rows||[]).filter(r=>r.date<s.date).slice(-1).flatMap(r=>r.nums));}const power=cross('super638'),daily=cross('daily539');if(s.flags[5]&&!power.size||s.flags[6]&&!daily.size)throw Error('跨彩種資料尚未載入');const overlap=(a,b)=>a.filter(n=>b.has(n)).length;
function valid(a){const z=new Set(a.map(n=>Math.floor(n/10))),o=a.filter(n=>n%2).length,sum=a.reduce((x,y)=>x+y,0);return (!s.odd.length||s.odd.includes(o))&&(!s.zones.length||z.size===s.zones.length&&s.zones.every(n=>z.has(n)))&&(s.zc===null||z.size===s.zc)&&sum>=s.min&&sum<=s.max&&(!s.tail||new Set(a.map(n=>n%10)).size<6)&&(!s.consecutive||a.some((n,i)=>i&&n-a[i-1]===1));}
let bestResult=null,bestTotal=-Infinity;const restarts=s.mode==='H'?18:3;for(let attempt=0;attempt<restarts;attempt++){let groups=[],used=new Set(),ps=new Set(),ts=new Set(),seen=new Set(),total=0;const core=s.core.length?s.core:shuffle(base.filter(n=>!s.must.includes(n))).slice(0,2);for(let g=0;g<s.count;g++){const fixed=sorted(new Set([...s.must,...((s.mode==='J'||s.mode==='K'&&g<Math.ceil(s.count/2))?core:[])]));if(fixed.length>6)throw Error('必選與核心合計超過6碼');const pool=base.filter(n=>!fixed.includes(n)&&(s.mode!=='H'||!used.has(n))&&(!s.zones.length||s.zones.includes(Math.floor(n/10))));if(pool.length<6-fixed.length)break;let best=null,bscore=-Infinity;for(let j=0;j<1000;j++){const a=sorted([...fixed,...shuffle(pool).slice(0,6-fixed.length)]);if(seen.has(a.join(','))||!valid(a))continue;let [ap,at]=combos(a),f=s.flags,score=0;if(f[0])score+=a.reduce((v,n)=>v+freq[n],0)/hist.length*5;if(f[1])score+=a.reduce((v,n)=>v+Math.min(gap[n],30),0)/30;if(f[2])score+=ap.reduce((v,n)=>v+(p.get(n)||0),0)/hist.length*10;if(f[3])score+=at.reduce((v,n)=>v+(t.get(n)||0),0)/hist.length*30;if(f[4])score-=Math.abs(overlap(a,recent)-1.5);if(f[5])score-=Math.abs(overlap(a,power)-1);if(f[6])score-=Math.abs(overlap(a,daily)-1);if(s.mode==='I'||s.mode==='K')score+=3*at.filter(n=>!ts.has(n)).length+ap.filter(n=>!ps.has(n)).length+0.25*a.filter(n=>!used.has(n)).length;score+=Math.random()*0.01;if(score>bscore){best=a;bscore=score;}if(s.mode==='A'&&!f.some(Boolean))break;}if(!best)break;groups.push(best);seen.add(best.join(','));best.forEach(n=>used.add(n));let [a,b]=combos(best);a.forEach(n=>ps.add(n));b.forEach(n=>ts.add(n));total+=bscore;}
if(groups.length===s.count&&total>bestTotal){bestTotal=total;bestResult={groups,used:sorted(used),pairs:ps.size,triples:ts.size,settings:s,sourceDates:Object.fromEntries(Object.entries(data).map(([g,d])=>[g,d.rows.filter(r=>r.date<s.date).at(-1)?.date||null]))};}if(bestResult&&s.mode==='H')break;}
if(!bestResult)throw Error('有限搜尋內找不到完整組合；請放寬條件，沒有自動忽略限制。');return bestResult;}
let current=null;
function read(k=key){const v=JSON.parse(localStorage.getItem(k)||'[]');if(!Array.isArray(v))throw Error('紀錄格式不正確');return v;}
function write(k,v){localStorage.setItem(k,JSON.stringify(v));}
function node(tag,text){let x=document.createElement(tag);x.textContent=text;return x;}
function result(r){let d=$('Result');d.replaceChildren();r.groups.forEach((a,i)=>d.append(node('p',`第${i+1}組：${fmt(a)}｜${a.filter(n=>n%2).length}奇${a.filter(n=>!(n%2)).length}偶｜和值${a.reduce((x,y)=>x+y,0)}`)));d.append(node('p',`不同號碼 ${r.used.length}/49｜兩碼 ${r.pairs}/${r.groups.length*15}｜三碼 ${r.triples}/${r.groups.length*20}`),node('p','未使用：'+fmt(U.filter(n=>!r.used.includes(n)))),node('p','資料截至：'+JSON.stringify(r.sourceDates)));}
$('Run').onclick=()=>{current=null;$('Save').disabled=true;$('Result').replaceChildren();try{if(!db.lotto649)throw Error('請先載入歷史資料');current=generate(opts(),db);result(current);$('Save').disabled=false;tell('模擬完成；結果不是預測。');}catch(e){tell(e.message);}};
function renderHistory(){let d=$('History');d.replaceChildren();try{let rows=read();if(!rows.length)d.append(node('p','尚無前瞻紀錄'));for(let r of [...rows].reverse()){let detail=node('details','');detail.append(node('summary',r.settings.date+'｜'+r.settings.mode+'｜'+r.groups.length+'組'));detail.append(node('p','建立時間 '+r.created));let draw=db.lotto649?.rows.find(x=>x.date===r.settings.date);r.groups.forEach((a,i)=>{let h=draw?a.filter(n=>draw.nums.includes(n)).length:null;detail.append(node('p',`第${i+1}組 ${fmt(a)}${draw?'｜主號命中'+h+'｜特別號'+(a.includes(draw.special)?'有':'無'):''}`));});if(draw)detail.append(node('p','實際開獎 '+fmt(draw.nums)+'｜特別號 '+draw.special));else detail.append(node('p','尚無該日開獎資料'));let b=node('button','刪除此筆');b.onclick=()=>{if(confirm('確定刪除此筆前瞻紀錄？')){write(key,read().filter(x=>x.id!==r.id));renderHistory();}};detail.append(b);d.append(detail);}}catch(e){tell(e.message);}}
$('Save').onclick=()=>{try{if(!current)throw Error('請先產生組合');const now=new Date();if(now>=new Date(current.settings.date+'T20:00:00+08:00')||db.lotto649?.rows.some(r=>r.date===current.settings.date))throw Error('已超過研究截止或已有開獎資料');const rows=read();if(rows.some(r=>r.settings.date===current.settings.date&&JSON.stringify(r.groups)===JSON.stringify(current.groups)))throw Error('相同組合已儲存');rows.push({...current,created:now.toISOString(),id:now.toISOString()+'-'+Math.random().toString(36).slice(2)});write(key,rows);$('Save').disabled=true;renderHistory();tell('前瞻研究已儲存');}catch(e){tell(e.message);}};
$('Check').onclick=async()=>{try{await loadData();renderHistory();tell('資料重新載入完成；請查看紀錄');}catch(e){tell(e.message);}};
$('Export').onclick=()=>{try{let blob=new Blob([JSON.stringify({version:8,forward:read(),research:read('lotto_research_v7')},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=node('a','');a.href=url;a.download='lotto-research-v8.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}catch(e){tell(e.message);}};
$('ImportBtn').onclick=()=>$('Import').click();$('Import').onchange=async()=>{try{let file=$('Import').files[0];if(!file)return;let obj=JSON.parse(await file.text()),research=Array.isArray(obj)?obj:obj.research,forward=Array.isArray(obj)?[]:obj.forward;if(!Array.isArray(research)||!Array.isArray(forward)||!research.every(r=>typeof r.model==='string'&&typeof r.date==='string'&&Number.isFinite(r.avg)&&Number.isFinite(r.hit)&&Number.isInteger(r.periods)&&typeof r.note==='string')||!forward.every(r=>typeof r.id==='string'&&typeof r.created==='string'&&r.settings&&typeof r.settings.date==='string'&&typeof r.settings.mode==='string'&&Array.isArray(r.groups)&&r.groups.every(a=>Array.isArray(a)&&a.length===6&&new Set(a).size===6&&a.every(n=>Number.isInteger(n)&&n>=1&&n<=49))))throw Error('備份格式不正確');const merge=(a,b,k)=>[...new Map([...a,...b].map(r=>[k(r),r])).values()];write('lotto_research_v7',merge(read('lotto_research_v7'),research,r=>JSON.stringify([r.model,r.periods,r.avg,r.hit,r.note])));write(key,merge(read(),forward,r=>r.id));renderHistory();tell('備份已合併；重新整理頁面可查看 V7 紀錄');}catch(e){tell(e.message);}finally{$('Import').value='';}};
// 防止 V7 完全相同的研究重複新增；提供逐筆刪除，維持舊資料格式。
const oldSave=document.getElementById('rSave');if(oldSave){const old=oldSave.onclick;oldSave.onclick=function(){try{const vals=['rModel','rPeriods','rAvg','rHit','rNote'].map(x=>document.getElementById(x).value);if(read('lotto_research_v7').some(r=>r.model===vals[0]&&r.periods===+vals[1]&&r.avg===+vals[2]&&r.hit===+vals[3]&&r.note===vals[4].trim())){document.getElementById('rStatus').textContent='相同研究已儲存';return;}old.call(this);}catch(e){document.getElementById('rStatus').textContent=e.message;}};}
const rr=document.getElementById('rResult');if(rr){const decorate=()=>{const rows=read('lotto_research_v7');[...rr.querySelectorAll('details')].forEach((d,i)=>{if(d.querySelector('[data-v8-delete]'))return;const r=rows[rows.length-1-i];if(!r)return;const b=node('button','刪除此筆研究');b.dataset.v8Delete='1';b.onclick=()=>{if(confirm('確定刪除此筆研究？')){const currentRows=read('lotto_research_v7'),idx=currentRows.findIndex(x=>JSON.stringify(x)===JSON.stringify(r));if(idx>=0){currentRows.splice(idx,1);write('lotto_research_v7',currentRows);d.remove();}}};d.append(b);});};new MutationObserver(()=>{try{decorate();}catch(e){tell(e.message);}}).observe(rr,{childList:true});try{decorate();}catch(e){tell(e.message);}}
const loadOriginal=loadData;loadData=async function(){await loadOriginal();renderHistory();};renderHistory();
})();
